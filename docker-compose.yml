version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for local compose}
      POSTGRES_DB: ${POSTGRES_DB:-acc}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-acc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  acc:
    build: .
    ports:
      - "${ACC_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      ACC_VERSION: ${ACC_VERSION:-1.3.0}
      POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acc}
      REDIS_URL: redis://redis:6379
      API_KEY: ${ACC_API_KEY:?set ACC_API_KEY}
      ALLOW_CORS_ORIGIN: ${ALLOW_CORS_ORIGIN:-http://localhost:3000}
      ACC_DB_SSL_REJECT_UNAUTHORIZED: "true"
      ACC_SEED_BASELINE: "false"

volumes:
  postgres-data:
